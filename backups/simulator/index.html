<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Reloj de Palabras (WordClock)</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header>
    <h1>Reloj de Palabras</h1>
    <p>Simulador interactivo de matriz LED 11x14 + 4 puntos de minutos</p>
  </header>

  <main class="container">
    
    <!-- Clock Simulator Grid -->
    <div class="clock-wrapper">
      <div class="physical-clock" id="wordclock">
        <div class="matrix-grid" id="matrix-grid">
          <!-- Filled dynamically by app.js -->
        </div>
        <div class="minutes-dots">
          <div class="dot" id="dot-1" title="+1 minuto"></div>
          <div class="dot" id="dot-2" title="+2 minutos"></div>
          <div class="dot" id="dot-3" title="+3 minutos"></div>
          <div class="dot" id="dot-4" title="+4 minutos"></div>
        </div>
      </div>
    </div>

    <!-- Simulator Control Panel -->
    <div class="control-panel">
      
      <!-- Time Mode Control -->
      <div class="panel-section">
        <div class="control-row">
          <h2>Hora del Simulador</h2>
          <div class="control-row">
            <span class="switch-label">Tiempo Real</span>
            <label class="switch">
              <input type="checkbox" id="realtime-toggle" checked>
              <span class="slider-switch"></span>
            </label>
          </div>
        </div>
        
        <div class="time-slider-wrapper">
          <div class="time-display-large" id="time-display">21:00</div>
          <input type="range" id="time-slider" min="0" max="1439" value="1260" class="range-slider" disabled>
        </div>
        
        <div class="control-row" id="manual-time-inputs" style="opacity: 0.5; pointer-events: none; transition: opacity 0.2s;">
          <span class="switch-label">Ajuste Fino:</span>
          <div class="time-input-row">
            <input type="number" id="hour-input" min="0" max="23" value="21">
            <span>:</span>
            <input type="number" id="minute-input" min="0" max="59" value="0">
          </div>
        </div>
      </div>

      <!-- Color Options -->
      <div class="panel-section">
        <h2>Color de LEDs</h2>
        <div class="color-presets" id="color-presets">
          <div class="color-swatch swatch-amber active" data-color="#ff8c00" data-glow="0 0 10px rgba(255, 140, 0, 0.7), 0 0 25px rgba(255, 140, 0, 0.4)"></div>
          <div class="color-swatch swatch-cyan" data-color="#00e5ff" data-glow="0 0 10px rgba(0, 229, 255, 0.7), 0 0 25px rgba(0, 229, 255, 0.4)"></div>
          <div class="color-swatch swatch-rose" data-color="#ff2a85" data-glow="0 0 10px rgba(255, 42, 133, 0.7), 0 0 25px rgba(255, 42, 133, 0.4)"></div>
          <div class="color-swatch swatch-green" data-color="#10b981" data-glow="0 0 10px rgba(16, 185, 129, 0.7), 0 0 25px rgba(16, 185, 129, 0.4)"></div>
          <div class="color-swatch swatch-purple" data-color="#a855f7" data-glow="0 0 10px rgba(168, 85, 247, 0.7), 0 0 25px rgba(168, 85, 247, 0.4)"></div>
          <div class="color-swatch swatch-white" data-color="#f1f5f9" data-glow="0 0 10px rgba(241, 245, 249, 0.7), 0 0 25px rgba(241, 245, 249, 0.4)"></div>
        </div>
      </div>

      <!-- WiFi Simulator -->
      <div class="panel-section">
        <h2>Simulador de Estado WiFi</h2>
        <div class="wifi-switches">
          <button class="wifi-btn active" data-level="0">Apagado</button>
          <button class="wifi-btn" data-level="1">Bajo</button>
          <button class="wifi-btn" data-level="2">Medio</button>
          <button class="wifi-btn" data-level="3">Fuerte</button>
        </div>
      </div>

      <!-- Active Words Output -->
      <div class="panel-section">
        <h2>Palabras Activas (Índices LED)</h2>
        <div class="active-words-list" id="active-words">
          <!-- Populated by app.js -->
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>Desarrollado para WordClock en Base a Matriz de 14 Filas × 11 Columnas</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
